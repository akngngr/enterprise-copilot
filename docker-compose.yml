services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copilot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: copilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  copilot_app:
    build: .
    container_name: copilot_app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/copilot_db
      - OLLAMA_BASE_URL=http://localhost:11434
      - GEN_MODEL=llama3
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENABLE_OLLAMA_PULL=${ENABLE_OLLAMA_PULL:-true}
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata:
  ollama_data:
